<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cấm tỏ tình</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .full-screen-img {
            width: 100vw;      /* Chiều rộng bằng 100% màn hình hiển thị */
            height: 100vh;     /* Chiều cao bằng 100% màn hình hiển thị */
            object-fit: cover; /* Tự động cắt và lấp đầy mà không làm méo ảnh */
            display: block;    /* Xóa khoảng trống thừa phía dưới ảnh */
        }
    </style>
</head>
<body>
    <img src="saidepchieu.jpg" alt="Quốc dũng tk7" class="full-screen-img">
</body>
</html>
